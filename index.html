<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>VA Squad</title>
  <meta name="description" content="Nine AI specialists for the modern Tech Virtual Assistant. Automation, GoHighLevel, and web marketing.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E🏁%3C/text%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <script src="https://cdn.jsdelivr.net/npm/react@18.3.1/umd/react.production.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@babel/standalone@7.25.0/babel.min.js"></script>
  <style>
    :root {
      color-scheme: dark;
      --bg: #000000;
      --bg-elev: #0a0a0a;
      --bg-card: #0f0f0f;
      --bg-hover: #141414;
      --border: #1f1f1f;
      --border-mid: #2a2a2a;
      --border-strong: #3a3a3a;
      --text: #fafafa;
      --text-dim: #9a9a9a;
      --text-dimmer: #5a5a5a;
      --red: #e10600;
      --red-hi: #ff1a1a;
      --red-dim: rgba(225, 6, 0, 0.1);
      --red-glow: rgba(225, 6, 0, 0.18);
      box-sizing: border-box;
      padding-top: env(safe-area-inset-top, 0px);
      padding-bottom: env(safe-area-inset-bottom, 0px);
    }
    * { font-family: 'Inter', -apple-system, system-ui, sans-serif; }
    .serif { font-family: 'Instrument Serif', Georgia, serif; font-weight: 400; letter-spacing: -0.01em; }
    body {
      background: var(--bg);
      color: var(--text);
      margin: 0;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }
    html, body { height: 100%; }
    html { scroll-padding-top: env(safe-area-inset-top, 0px); }

    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--border-mid); border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: var(--red); }

    @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes blink { 0%, 60%, 100% { opacity: 0.25; } 30% { opacity: 1; } }
    @keyframes shimmer { 0%, 100% { opacity: 0.4; } 50% { opacity: 1; } }
    @keyframes slideUp { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }

    .fade-in { animation: fadeIn 0.3s ease-out; }
    .slide-up { animation: slideUp 0.35s cubic-bezier(0.22, 1, 0.36, 1); }
    .blink { animation: blink 1.4s ease-in-out infinite; }
    .shimmer { animation: shimmer 1.6s ease-in-out infinite; }

    .card {
      position: relative;
      background: var(--bg-card);
      border: 1px solid var(--border);
      transition: border-color 0.25s ease, transform 0.25s ease, background 0.25s ease;
    }
    .card::before {
      content: "";
      position: absolute;
      inset: 0;
      border-radius: inherit;
      pointer-events: none;
      box-shadow: 0 0 0 0 var(--red-glow);
      transition: box-shadow 0.3s ease;
    }
    .card:hover { border-color: var(--red); background: var(--bg-hover); transform: translateY(-2px); }
    .card:hover::before { box-shadow: 0 24px 60px -24px var(--red-glow); }

    .red-line { background: linear-gradient(90deg, transparent, var(--red) 50%, transparent); height: 1px; }
    .hero-mark { font-family: 'Instrument Serif', Georgia, serif; font-style: italic; font-weight: 400; }

    textarea:focus, input:focus { outline: none; }

    .typing-dot { display: inline-block; width: 6px; height: 6px; background: var(--red); border-radius: 50%; margin-right: 4px; }
    .typing-dot:nth-child(1) { animation: blink 1.4s ease-in-out infinite; }
    .typing-dot:nth-child(2) { animation: blink 1.4s ease-in-out 0.2s infinite; }
    .typing-dot:nth-child(3) { animation: blink 1.4s ease-in-out 0.4s infinite; margin-right: 0; }

    .prose-chat { white-space: pre-wrap; word-wrap: break-word; line-height: 1.65; }

    .starter-btn { transition: all 0.2s ease; }
    .starter-btn:hover { border-color: var(--red); color: var(--text); background: var(--bg-hover); }

    .safe-top { padding-top: env(safe-area-inset-top, 0px); }
    .safe-bottom { padding-bottom: env(safe-area-inset-bottom, 0px); }

    body::before {
      content: "";
      position: fixed;
      inset: 0 0 auto;
      height: env(safe-area-inset-top, 0px);
      background: var(--bg);
      z-index: 50;
    }

    .input-field {
      background: var(--bg-card);
      border: 1px solid var(--border-mid);
      color: var(--text);
      padding: 0.75rem 1rem;
      transition: border-color 0.2s ease;
      width: 100%;
      font-size: 14px;
    }
    .input-field:focus { border-color: var(--red); }
    .input-field::placeholder { color: var(--text-dimmer); }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel" data-presets="react">
    const { useState, useEffect, useRef, useCallback } = React;

    // ============================================================
    // CONFIG
    // ============================================================
    const STORAGE = {
      apiKey: 'va_squad_api_key',
      model: 'va_squad_model',
      chat: (agentId) => `va_squad_chat_${agentId}`,
    };

    const DEFAULT_MODEL = 'claude-sonnet-4-5';

    const MODELS = [
      { id: 'claude-sonnet-4-5', name: 'Claude Sonnet 4.5', note: 'Balanced. Recommended.' },
      { id: 'claude-haiku-4-5', name: 'Claude Haiku 4.5', note: 'Fastest, cheapest.' },
      { id: 'claude-opus-4-5', name: 'Claude Opus 4.5', note: 'Most capable, pricier.' },
    ];

    // ============================================================
    // AGENT DEFINITIONS
    // ============================================================
    const AGENTS = [
      {
        id: 'sage', name: 'Sage', role: 'Contract Expert', emoji: '⚖',
        tagline: 'Spots red flags and drafts airtight client agreements.',
        starters: ['Review a contract I was sent', 'Draft a service agreement from scratch', 'What clauses protect me from scope creep?'],
        systemPrompt: `You are Sage, a Contract Expert for Tech Virtual Assistants (VAs) who work in automation, GoHighLevel, and web marketing.

PURPOSE: Help the user review, draft, and negotiate contracts that protect their interests as a freelance Tech VA.

GOALS:
- Spot red flags in client contracts: unlimited revisions, vague scope, slow payment terms, IP overreach, auto-renewing exclusivity, one-sided termination
- Draft clean service agreements from scratch
- Explain legal jargon in plain English
- Suggest protective clauses: kill fees, late payment penalties, scope creep protection, clear deliverables, revision limits
- Help negotiate better terms with calm, professional language

RULES:
- Open every new conversation by reminding the user you are not a lawyer, and suggest consulting one for high value contracts
- Ask clarifying questions first: contract value, client location, service type, duration, who sent the contract
- Point out what is MISSING from a contract, not just what is risky
- Use short bullet points for red flags and recommendations
- Be direct and protective. Do not sugarcoat risks
- Never use em dashes in your writing. Use periods, colons, or "and" instead
- Keep responses focused. No filler

TONE: Professional, sharp, protective. Like a lawyer friend who looks out for you.`,
      },
      {
        id: 'mira', name: 'Mira', role: 'Interview Coach', emoji: '◐',
        tagline: 'Preps you for discovery calls and client interviews.',
        starters: ['Run a mock interview for a GHL VA role', 'Help me answer "why should we hire you?"', 'Prep me for an Upwork video call'],
        systemPrompt: `You are Mira, an Interview Coach for Tech Virtual Assistants preparing for client discovery calls, Upwork video interviews, and sales conversations.

PURPOSE: Help the user win more client interviews with sharper preparation, better answers, and real confidence.

GOALS:
- Prep answers for common VA interview questions
- Run mock interviews with realistic client questions
- Give honest, specific feedback on answers
- Handle tough objections: price, experience level, availability, time zone, portfolio gaps
- Build genuine confidence before the real call

RULES:
- Offer two modes at the start: "Prep Mode" (strategy and example answers) or "Mock Mode" (act as the client, give feedback after each answer)
- Ask about the role, client industry, and the user's experience level before starting
- Give honest feedback, including what did not land
- Include cultural awareness tips for international clients (US, EU, AU, UK) when relevant
- Keep responses punchy. No long lectures
- Never use em dashes. Use periods, colons, or "and" instead

TONE: Supportive but honest mentor. Like a coach who believes in you but will not let you slide.`,
      },
      {
        id: 'rex', name: 'Rex', role: 'GHL Troubleshooter', emoji: '◇',
        tagline: 'Diagnoses and fixes GoHighLevel issues fast.',
        starters: ['My GHL workflow is not triggering', 'SMS not sending from my sub-account', 'How do I set up A2P 10DLC?'],
        systemPrompt: `You are Rex, a GoHighLevel (GHL) Troubleshooter. You help Tech VAs diagnose and fix issues inside GHL sub-accounts and agency accounts.

PURPOSE: Resolve GHL technical issues, workflow bugs, integration errors, and configuration problems step by step.

GOALS:
- Diagnose issues through smart, targeted questions
- Give clean, numbered fix instructions
- Explain WHY something broke so the user learns, not just how to patch it
- Cover: workflows, triggers, filters, pipelines, opportunities, calendars, forms, surveys, funnels, websites, email and SMS delivery, Twilio, A2P 10DLC, API, snapshots, memberships, payments

RULES:
- Always ask for specifics FIRST: which sub-account area, which feature, the exact error message, what changed recently
- Give instructions in numbered steps
- Name menu paths exactly, for example "Settings then Business Profile then Phone Numbers"
- If the issue sits outside GHL (DNS, Twilio, Stripe, LC Phone, domain registrar), say so clearly and guide the user to the right place
- Suggest a test step after each fix so the user can verify
- Never use em dashes. Use periods, colons, or "and" instead
- Keep tone calm even when the user is frustrated

TONE: Patient senior tech support. Clear, methodical, confident.`,
      },
      {
        id: 'vera', name: 'Vera', role: 'Graphic Designer', emoji: '◈',
        tagline: 'Design direction, color, and layout critique.',
        starters: ['Suggest a color palette for a wellness brand', 'Font pairings for a tech startup', 'Critique my landing page design'],
        systemPrompt: `You are Vera, a Graphic Design Advisor helping Tech Virtual Assistants level up their visual work in Canva, Figma, and other tools.

PURPOSE: Give design direction, critique visuals when described, and recommend color, typography, and layout improvements for client work and personal brand.

GOALS:
- Suggest color palettes with real hex codes
- Recommend specific font pairings by name
- Review layouts and critique when the user describes or shares concepts
- Guide brand direction for client work
- Teach visual hierarchy, spacing, contrast, and alignment

RULES:
- You cannot see images unless the user describes them in detail. Ask for the description if needed
- Always ask what the design is FOR first: audience, platform, goal, brand vibe
- Give specific suggestions: hex codes, font names, spacing values, not vague advice
- Teach the "why" behind design choices so the user learns
- Recommend free or affordable resources when possible (Google Fonts, Unsplash, Coolors, Pexels)
- Never use em dashes. Use periods, colons, or "and" instead
- Keep responses visual: use concrete examples

TONE: Creative, visual, enthusiastic. A designer friend who gets excited about good taste and strong choices.`,
      },
      {
        id: 'pitch', name: 'Pitch', role: 'Cold Outreach Writer', emoji: '◢',
        tagline: 'Writes cold emails and DMs that actually get replies.',
        starters: ['Write a cold email to a dentist about automation', 'Craft an Upwork proposal for GHL work', 'Follow-up sequence after no reply'],
        systemPrompt: `You are Pitch, a Cold Outreach Copywriter for Tech Virtual Assistants. You write cold emails, LinkedIn DMs, Upwork proposals, and follow-ups that actually get replies.

PURPOSE: Help the user craft outreach messages that stand out, feel human, and convert.

GOALS:
- Write personalized cold emails
- Craft LinkedIn connection notes and DM sequences
- Write Upwork proposals that win jobs
- Build follow-up sequences (2 to 4 touches)
- Punch up weak copy the user shares

RULES:
- Always ask first: target audience, service offered, offer or CTA, tone preference, where it will be sent
- Keep messages SHORT, value-first, no spammy language
- Banned openers: "I hope this email finds you well", "My name is", "I came across your"
- Every line must earn its place. Cut filler
- Give 2 to 3 variations when possible, with a one line note on why each works
- Never use em dashes. Use periods, colons, or "and" instead
- End with a soft, specific CTA, never "Let me know if interested"

TONE: Sharp, strategic, no fluff. Like a copywriter who hates wasted words.`,
      },
      {
        id: 'max', name: 'Max', role: 'Proposal and Pricing Coach', emoji: '◆',
        tagline: 'Helps you charge more and close bigger deals.',
        starters: ['Help me price my GHL setup service', 'Write a proposal for a monthly retainer', 'How do I handle "that is too expensive"?'],
        systemPrompt: `You are Max, a Proposal and Pricing Coach for Tech Virtual Assistants.

PURPOSE: Help the user charge what they are actually worth and win higher ticket clients with better proposals.

GOALS:
- Advise on pricing models: hourly, project, retainer, performance based, value based
- Help package services into clear tiers or niche offers
- Write client proposals that close
- Coach on handling price objections
- Explain positioning, niche, and value based pricing

RULES:
- Ask first: current rates, niche, experience level, location, target client type
- Push the user to consider value based pricing over hourly where it makes sense
- Reference typical market rates when known, and acknowledge they vary by region and specialty
- Teach positioning, not just numbers
- Give a clean proposal structure when asked: problem, solution, scope, investment, timeline, next step, terms
- Never use em dashes. Use periods, colons, or "and" instead
- Challenge low self-pricing kindly but directly

TONE: Confident business coach. Direct, growth minded, believes in charging more.`,
      },
      {
        id: 'flow', name: 'Flow', role: 'SOP and Workflow Builder', emoji: '◧',
        tagline: 'Turns messy processes into clean SOPs.',
        starters: ['Build an SOP for client reporting', 'Document a GHL onboarding workflow', 'Create a weekly check-in process'],
        systemPrompt: `You are Flow, a Standard Operating Procedure (SOP) and Workflow Builder for Tech Virtual Assistants.

PURPOSE: Help the user document repeatable processes so they can delegate work, scale their service, or deliver consistently to clients.

GOALS:
- Build clear, step by step SOPs
- Design client workflows: onboarding, reporting, task handoff, offboarding
- Structure recurring deliverables
- Suggest the right tool stacks for documenting workflows: Notion, ClickUp, Trello, Loom, Google Docs, Tango

RULES:
- Always ask first: what is the process, who will use it, how often it runs, what tools are involved
- Use clean numbered steps with sub-steps where needed
- Suggest where to add screenshots or short Loom videos
- Include "what could go wrong" checkpoints
- End every SOP with a QA or review step
- Never use em dashes. Use periods, colons, or "and" instead
- Keep structure obvious. Use headings and numbered lists

TONE: Organized, methodical, systems thinker. Calm and structured.`,
      },
      {
        id: 'nova', name: 'Nova', role: 'Client Onboarding Specialist', emoji: '◉',
        tagline: 'Designs smooth client onboarding experiences.',
        starters: ['Design a welcome packet for new clients', 'Script a kickoff call agenda', 'Build a client intake form'],
        systemPrompt: `You are Nova, a Client Onboarding Specialist for Tech Virtual Assistants.

PURPOSE: Help the user design smooth, professional onboarding experiences that make a strong first impression and set clear expectations from day one.

GOALS:
- Design welcome packets and welcome emails
- Script kickoff and discovery call agendas
- Build client intake forms and questionnaires
- Set up communication and reporting cadences
- Create "first 30 days" client plans

RULES:
- Ask first about the service type and the client type
- Keep onboarding simple but thorough
- Always include: scope, communication rules, timelines, point of contact, tools used, escalation path
- Emphasize setting expectations early to prevent future problems
- Suggest reusable templates the user can save
- Never use em dashes. Use periods, colons, or "and" instead

TONE: Warm professional. Polished, welcoming, confident.`,
      },
      {
        id: 'volt', name: 'Volt', role: 'GHL and N8N Automation Architect', emoji: '◭',
        tagline: 'Designs and builds automation workflows that hold up.',
        starters: ['Connect GHL to Google Sheets via N8N', 'Automate lead qualification in GHL', 'Set up a webhook from GHL to Slack'],
        systemPrompt: `You are Volt, an Automation Architect specialized in GoHighLevel (GHL) and N8N for Tech Virtual Assistants.

PURPOSE: Help the user design, build, and troubleshoot automation workflows across GHL, N8N, and connected tools.

GOALS:
- Design workflows: triggers, actions, conditions, delays, filters
- Connect GHL to N8N via webhooks or API
- Integrate third-party tools: Google Sheets, Airtable, Slack, OpenAI, Stripe, Twilio, Calendly, Make
- Optimize automations for reliability and clarity
- Explain the LOGIC, not just the clicks

RULES:
- Always ask first: what is the trigger, what is the desired outcome, what tools are involved, what data moves between them
- Map the workflow in plain English BEFORE the technical steps
- Mention edge cases: contact already exists, webhook fails, rate limits, duplicate triggers, timezone drift
- For GHL: name the exact trigger, action, or filter
- For N8N: name the exact node and configuration
- Suggest a testing strategy for every automation you design
- Never use em dashes. Use periods, colons, or "and" instead

TONE: Systems thinker, technically precise but clear. Like a senior automation engineer who teaches as they go.`,
      },
    ];

    // ============================================================
    // STORAGE HELPERS
    // ============================================================
    const getApiKey = () => { try { return localStorage.getItem(STORAGE.apiKey) || ''; } catch { return ''; } };
    const setApiKeyStore = (k) => {
      try {
        if (k) localStorage.setItem(STORAGE.apiKey, k);
        else localStorage.removeItem(STORAGE.apiKey);
      } catch {}
    };
    const getModel = () => { try { return localStorage.getItem(STORAGE.model) || DEFAULT_MODEL; } catch { return DEFAULT_MODEL; } };
    const setModelStore = (m) => { try { localStorage.setItem(STORAGE.model, m); } catch {} };
    const loadMessages = (agentId) => {
      try { return JSON.parse(localStorage.getItem(STORAGE.chat(agentId)) || '[]'); }
      catch { return []; }
    };
    const saveMessages = (agentId, messages) => {
      try { localStorage.setItem(STORAGE.chat(agentId), JSON.stringify(messages)); } catch {}
    };
    const clearMessagesStore = (agentId) => {
      try { localStorage.removeItem(STORAGE.chat(agentId)); } catch {}
    };
    const clearAllData = () => {
      try {
        localStorage.removeItem(STORAGE.apiKey);
        localStorage.removeItem(STORAGE.model);
        AGENTS.forEach(a => localStorage.removeItem(STORAGE.chat(a.id)));
      } catch {}
    };

    // ============================================================
    // ANTHROPIC API CLIENT (streaming)
    // ============================================================
    async function streamChat({ apiKey, model, systemPrompt, messages, signal, onText }) {
      const response = await fetch('https://api.anthropic.com/v1/messages', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'x-api-key': apiKey,
          'anthropic-version': '2023-06-01',
          'anthropic-dangerous-direct-browser-access': 'true',
        },
        signal,
        body: JSON.stringify({
          model,
          max_tokens: 2048,
          stream: true,
          system: systemPrompt,
          messages: messages.map(m => ({ role: m.role, content: m.content })),
        }),
      });

      if (!response.ok) {
        let errMsg = `HTTP ${response.status}`;
        try {
          const errData = await response.json();
          errMsg = errData?.error?.message || errMsg;
        } catch {
          try { errMsg = (await response.text()) || errMsg; } catch {}
        }
        const err = new Error(errMsg);
        err.status = response.status;
        throw err;
      }

      const reader = response.body.getReader();
      const decoder = new TextDecoder();
      let fullText = '';
      let buffer = '';

      try {
        while (true) {
          const { done, value } = await reader.read();
          if (done) break;
          buffer += decoder.decode(value, { stream: true });

          const lines = buffer.split('\n');
          buffer = lines.pop() || '';

          for (const line of lines) {
            if (!line.startsWith('data: ')) continue;
            const data = line.slice(6).trim();
            if (!data) continue;
            try {
              const event = JSON.parse(data);
              if (event.type === 'content_block_delta' && event.delta?.type === 'text_delta') {
                fullText += event.delta.text;
                onText && onText(fullText);
              }
            } catch {}
          }
        }
      } finally {
        try { reader.releaseLock(); } catch {}
      }

      return fullText;
    }

    // ============================================================
    // APP ROOT
    // ============================================================
    function App() {
      const [selectedAgent, setSelectedAgent] = useState(null);
      const [hasKey, setHasKey] = useState(() => !!getApiKey());
      const [showSettings, setShowSettings] = useState(false);

      if (!hasKey) {
        return <ApiKeySetup onSaved={() => setHasKey(true)} />;
      }

      return (
        <>
          {selectedAgent ? (
            <ChatView
              agent={selectedAgent}
              onBack={() => setSelectedAgent(null)}
              onOpenSettings={() => setShowSettings(true)}
            />
          ) : (
            <HeroView
              onSelectAgent={setSelectedAgent}
              onOpenSettings={() => setShowSettings(true)}
            />
          )}
          {showSettings && (
            <SettingsModal
              onClose={() => setShowSettings(false)}
              onReset={() => { setHasKey(false); setShowSettings(false); setSelectedAgent(null); }}
            />
          )}
        </>
      );
    }

    // ============================================================
    // API KEY SETUP (first-run)
    // ============================================================
    function ApiKeySetup({ onSaved }) {
      const [key, setKey] = useState('');
      const [error, setError] = useState('');

      const save = () => {
        const trimmed = key.trim();
        if (!trimmed) { setError('Paste your API key to continue.'); return; }
        if (!trimmed.startsWith('sk-ant-')) {
          setError('That does not look like an Anthropic API key. It should start with sk-ant-'); return;
        }
        setApiKeyStore(trimmed);
        onSaved();
      };

      return (
        <div className="min-h-screen bg-black flex items-center justify-center px-5">
          <div className="max-w-md w-full fade-in">
            <div className="flex items-center gap-2.5 mb-10">
              <div className="w-8 h-8 bg-[var(--red)] flex items-center justify-center">
                <span className="serif italic text-white text-xl leading-none">V</span>
              </div>
              <span className="font-semibold tracking-tight text-white text-lg">VA Squad</span>
            </div>

            <div className="flex items-center gap-2 mb-5">
              <div className="w-2 h-2 bg-[var(--red)] rounded-full blink"></div>
              <span className="text-[11px] tracking-[0.2em] text-neutral-500 font-medium">ONE-TIME SETUP</span>
            </div>

            <h1 className="serif text-4xl md:text-5xl text-white mb-4 leading-tight">
              Connect to <span className="hero-mark text-[var(--red)]">Claude</span>.
            </h1>
            <p className="text-neutral-400 text-[15px] leading-relaxed mb-8">
              VA Squad uses your own Anthropic API key. The key stays in this browser only. It is never uploaded anywhere except directly to Anthropic when you chat.
            </p>

            <label className="block text-[11px] tracking-[0.15em] text-neutral-500 mb-2">ANTHROPIC API KEY</label>
            <input
              type="password"
              value={key}
              onChange={(e) => { setKey(e.target.value); setError(''); }}
              onKeyDown={(e) => e.key === 'Enter' && save()}
              placeholder="sk-ant-..."
              className="input-field font-mono"
              autoFocus
            />
            {error && <div className="text-xs text-red-400 mt-2">{error}</div>}

            <button
              onClick={save}
              className="w-full mt-4 h-11 bg-[var(--red)] hover:bg-[var(--red-hi)] text-white font-medium transition-colors"
            >
              Save and continue
            </button>

            <div className="mt-8 pt-6 border-t border-[var(--border)]">
              <p className="text-xs text-neutral-500 mb-3">Don't have a key yet?</p>
              <a
                href="https://console.anthropic.com/settings/keys"
                target="_blank"
                rel="noopener noreferrer"
                className="text-xs text-[var(--red)] hover:text-[var(--red-hi)] transition-colors"
              >
                Get one at console.anthropic.com →
              </a>
            </div>

    // ============================================================
    // CHAT VIEW
    // ============================================================
    function ChatView({ agent, onBack, onOpenSettings }) {
      const [messages, setMessages] = useState(() => loadMessages(agent.id));
      const [input, setInput] = useState('');
      const [streaming, setStreaming] = useState(null);
      const [loading, setLoading] = useState(false);
      const [error, setError] = useState(null);
      const [showPrompt, setShowPrompt] = useState(false);

      const scrollRef = useRef(null);
      const abortRef = useRef(null);
      const textareaRef = useRef(null);

      useEffect(() => {
        if (scrollRef.current) {
          scrollRef.current.scrollTop = scrollRef.current.scrollHeight;
        }
      }, [messages, streaming, loading]);

      const sendMessage = useCallback(async (text) => {
        const trimmed = (text ?? input).trim();
        if (!trimmed || loading) return;
        setError(null);

        const apiKey = getApiKey();
        if (!apiKey) {
          setError('No API key found. Open settings to add one.');
          return;
        }

        const userMsg = { role: 'user', content: trimmed };
        const nextMessages = [...messages, userMsg];
        setMessages(nextMessages);
        setInput('');
        if (textareaRef.current) textareaRef.current.style.height = 'auto';
        setLoading(true);
        setStreaming('');

        const ctl = new AbortController();
        abortRef.current = ctl;

        try {
          const fullText = await streamChat({
            apiKey,
            model: getModel(),
            systemPrompt: agent.systemPrompt,
            messages: nextMessages,
            signal: ctl.signal,
            onText: (text) => setStreaming(text),
          });
          const finalMessages = [...nextMessages, { role: 'assistant', content: fullText }];
          setMessages(finalMessages);
          saveMessages(agent.id, finalMessages);
          setStreaming(null);
          setLoading(false);
          abortRef.current = null;
        } catch (e) {
          abortRef.current = null;
          setLoading(false);
          if (e.name === 'AbortError') {
            if (streaming) {
              const finalMessages = [...nextMessages, { role: 'assistant', content: streaming + '\n\n[Stopped]' }];
              setMessages(finalMessages);
              saveMessages(agent.id, finalMessages);
            }
            setStreaming(null);
            return;
          }
          setStreaming(null);
          let msg = e.message || 'Something went wrong.';
          if (e.status === 401) msg = 'API key rejected. Open settings to update it.';
          else if (e.status === 429) msg = 'Rate limited. Wait a moment and try again.';
          else if (e.status === 529) msg = 'Anthropic is overloaded. Try again shortly.';
          else if (e.status >= 500) msg = 'Anthropic service error. Try again shortly.';
          setError(msg);
        }
      }, [input, loading, messages, agent, streaming]);

      const stopGenerating = () => { if (abortRef.current) abortRef.current.abort(); };

      const clearChat = () => {
        if (loading) return;
        const ok = window.confirm(`Clear your entire conversation with ${agent.name}? This cannot be undone.`);
        if (!ok) return;
        setMessages([]);
        setStreaming(null);
        setError(null);
        clearMessagesStore(agent.id);
      };

      const handleKey = (e) => {
        if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }
      };
      const handleInput = (e) => {
        setInput(e.target.value);
        const el = e.target;
        el.style.height = 'auto';
        el.style.height = Math.min(el.scrollHeight, 200) + 'px';
      };

      return (
        <div className="h-screen flex flex-col bg-black">
          <ChatHeader
            agent={agent}
            onBack={onBack}
            onViewPrompt={() => setShowPrompt(true)}
            onClear={clearChat}
            onOpenSettings={onOpenSettings}
            hasMessages={messages.length > 0}
          />

          <div ref={scrollRef} className="flex-1 overflow-y-auto">
            <div className="max-w-3xl mx-auto px-5 md:px-6 py-8">
              {messages.length === 0 && !streaming ? (
                <EmptyState agent={agent} onStarter={sendMessage} />
              ) : (
                <>
                  {messages.map((msg, i) => <MessageBubble key={i} message={msg} agent={agent} />)}
                  {streaming !== null && (
                    <MessageBubble
                      message={{ role: 'assistant', content: streaming || '' }}
                      agent={agent}
                      isStreaming={true}
                    />
                  )}
                  {loading && streaming === '' && (
                    <div className="flex items-start gap-3 mb-6 slide-up">
                      <AgentAvatar agent={agent} />
                      <div className="flex items-center h-6 pt-1">
                        <span className="typing-dot"></span>
                        <span className="typing-dot"></span>
                        <span className="typing-dot"></span>
                      </div>
                    </div>
                  )}
                </>
              )}

              {error && (
                <div className="mt-4 p-4 border border-red-900 bg-red-950/30 text-sm text-red-300 fade-in">
                  {error}
                </div>
              )}
            </div>
          </div>

          <div className="border-t border-[var(--border)] bg-black safe-bottom">
            <div className="max-w-3xl mx-auto px-5 md:px-6 py-4">
              <div className="flex items-end gap-2">
                <div className="flex-1 bg-[var(--bg-card)] border border-[var(--border-mid)] focus-within:border-[var(--red)] transition-colors rounded-sm">
                  <textarea
                    ref={textareaRef}
                    value={input}
                    onChange={handleInput}
                    onKeyDown={handleKey}
                    placeholder={`Message ${agent.name}...`}
                    disabled={loading}
                    rows="1"
                    className="w-full bg-transparent text-white placeholder:text-neutral-600 px-4 py-3 resize-none focus:outline-none text-[15px] leading-relaxed disabled:opacity-50"
                    style={{ maxHeight: '200px' }}
                  />
                </div>
                {loading ? (
                  <button
                    onClick={stopGenerating}
                    className="h-11 px-4 bg-black border border-[var(--border-strong)] text-white hover:border-[var(--red)] hover:text-[var(--red)] transition-colors text-sm font-medium"
                  >
                    Stop
                  </button>
                ) : (
                  <button
                    onClick={() => sendMessage()}
                    disabled={!input.trim()}
                    className="h-11 px-5 bg-[var(--red)] hover:bg-[var(--red-hi)] text-white font-medium transition-colors disabled:bg-neutral-900 disabled:text-neutral-700 disabled:cursor-not-allowed"
                  >
                    Send
                  </button>
                )}
              </div>
              <div className="flex items-center justify-between mt-2">
                <span className="text-[10px] text-neutral-700 tracking-wider">ENTER TO SEND. SHIFT + ENTER FOR NEW LINE.</span>
                {messages.length > 0 && (
                  <span className="text-[10px] text-neutral-700 tracking-wider">
                    {messages.length} MESSAGE{messages.length === 1 ? '' : 'S'} SAVED
                  </span>
                )}
              </div>
            </div>
          </div>

          {showPrompt && <PromptModal agent={agent} onClose={() => setShowPrompt(false)} />}
        </div>
      );
    }

    // ============================================================
    // PROMPT MODAL
    // ============================================================
    function PromptModal({ agent, onClose }) {
      const [copied, setCopied] = useState(false);

      const copy = async () => {
        try {
          await navigator.clipboard.writeText(agent.systemPrompt);
          setCopied(true);
          setTimeout(() => setCopied(false), 2000);
        } catch (e) {
          const ta = document.createElement('textarea');
          ta.value = agent.systemPrompt;
          document.body.appendChild(ta);
          ta.select();
          try { document.execCommand('copy'); setCopied(true); setTimeout(() => setCopied(false), 2000); } catch(_) {}
          document.body.removeChild(ta);
        }
      };

      useEffect(() => {
        const onEsc = (e) => { if (e.key === 'Escape') onClose(); };
        window.addEventListener('keydown', onEsc);
        document.body.style.overflow = 'hidden';
        return () => { window.removeEventListener('keydown', onEsc); document.body.style.overflow = ''; };
      }, [onClose]);

      return (
        <div className="fixed inset-0 z-50 bg-black/80 backdrop-blur-sm flex items-center justify-center p-4 fade-in" onClick={onClose}>
          <div onClick={(e) => e.stopPropagation()} className="bg-[var(--bg-elev)] border border-[var(--border-mid)] max-w-2xl w-full max-h-[85vh] flex flex-col slide-up">
            <div className="flex items-center justify-between px-5 py-4 border-b border-[var(--border)]">
              <div className="flex items-center gap-3">
                <AgentAvatar agent={agent} small />
                <div>
                  <div className="text-[11px] text-[var(--red)] tracking-wider">{agent.role.toUpperCase()}</div>
                  <div className="font-semibold text-white">{agent.name} system prompt</div>
                </div>
              </div>
              <button onClick={onClose} className="w-8 h-8 flex items-center justify-center text-neutral-500 hover:text-white hover:bg-[var(--bg-card)] transition-colors" aria-label="Close">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2">
                  <path d="M18 6L6 18M6 6l12 12"/>
                </svg>
              </button>
            </div>
            <div className="flex-1 overflow-y-auto px-5 py-4">
              <pre className="text-[13px] text-neutral-300 whitespace-pre-wrap font-mono leading-relaxed">
{agent.systemPrompt}
              </pre>
            </div>
            <div className="flex items-center justify-between px-5 py-3 border-t border-[var(--border)] bg-black">
              <span className="text-[11px] text-neutral-600">Paste into any AI chat to use this agent elsewhere.</span>
              <button onClick={copy} className="px-4 h-9 bg-[var(--red)] hover:bg-[var(--red-hi)] text-white text-sm font-medium transition-colors">
                {copied ? 'Copied' : 'Copy prompt'}
              </button>
            </div>
          </div>
        </div>
      );
    }

    // ============================================================
    // MOUNT
    // ============================================================
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
